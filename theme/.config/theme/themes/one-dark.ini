[theme]
name = One Dark
palette = #282c34 #e06c75 #98c379 #e5c07b #61afef #c678dd #56b6c2 #abb2bf

[ghostty]
theme = Atom One Dark

[wezterm]
dark = One Dark (Gogh)
light = One Dark (Gogh)

[nvim]
colorscheme = onedark

[herdr]
name = one-dark
dark_name = one-dark
light_name = one-dark

[zellij]
theme = onedark

[starship]
palette = one_dark

[tmux]
theme = onedark
variant = dark

[fzf]
colors = --color=fg:#abb2bf,bg:#282c34,hl:#61afef --color=fg+:#abb2bf,bg+:#3e4452,hl+:#61afef --color=border:#5c6370,header:#98c379,gutter:#282c34 --color=spinner:#e5c07b,info:#56b6c2 --color=pointer:#c678dd,marker:#e06c75,prompt:#61afef

[vscode]
theme = Atom One Dark
