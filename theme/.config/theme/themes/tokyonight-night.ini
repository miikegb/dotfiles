[theme]
name = Tokyo Night
palette = #1a1b26 #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #c0caf5

[ghostty]
theme = light:TokyoNight Day,dark:TokyoNight Night

[nvim]
colorscheme = tokyonight-night

[herdr]
name = tokyo-night
dark_name = tokyo-night
light_name = tokyo-night

[zellij]
theme = tokyo-night

[yazi]
dark = tokyo-night
light = tokyo-night
package = BennyOe/tokyo-night

[starship]
palette = tokyonight_night

[tmux]
theme = tokyo-night
variant = night

[fzf]
colors = --color=fg:#c0caf5,bg:#1a1b26,hl:#2ac3de --color=fg+:#c0caf5,bg+:#283457,hl+:#2ac3de --color=border:#27a1b9,header:#ff9e64,gutter:#16161e --color=spinner:#ff007c,info:#545c7e --color=pointer:#ff007c,marker:#ff007c,prompt:#2ac3de

[vscode]
theme = Tokyo Night
