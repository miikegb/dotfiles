[theme]
name = Catppuccin Mocha
palette = #1e1e2e #f38ba8 #a6e3a1 #f9e2af #89b4fa #cba6f7 #94e2d5 #cdd6f4

[ghostty]
theme = light:Catppuccin Latte,dark:Catppuccin Mocha

[wezterm]
dark = Catppuccin Mocha
light = Catppuccin Latte

[nvim]
colorscheme = catppuccin-mocha

[herdr]
name = catppuccin
dark_name = catppuccin
light_name = catppuccin

[zellij]
theme = catppuccin-mocha

[yazi]
dark = catppuccin-mocha
light = catppuccin-mocha
package = yazi-rs/flavors:catppuccin-mocha

[starship]
palette = catppuccin_mocha

[tmux]
theme = catppuccin
variant = mocha

[fzf]
colors = --color=fg:#cdd6f4,bg:#1e1e2e,hl:#f38ba8 --color=fg+:#cdd6f4,bg+:#313244,hl+:#f38ba8 --color=border:#313244,header:#f38ba8,gutter:#1e1e2e --color=spinner:#f5e0dc,info:#cba6f7 --color=pointer:#f5e0dc,marker:#b4befe,prompt:#cba6f7

[vscode]
theme = Catppuccin Mocha
